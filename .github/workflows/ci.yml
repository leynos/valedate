name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install CLI tools
        run: |
          for tool in mbake ty ruff; do uv tool install ${tool}; done

      # The harness drives a real Vale binary and provides no stub, so the
      # tests need one on PATH. Pin the release and verify its checksum.
      - name: Install Vale
        env:
          VALE_VERSION: '3.22.0'
          VALE_SHA256: '52f5cd0314a1b7384cac6aa102a68193977312f6ba9c9f3ae001b5deec8e3a10'
        run: |
          vale_dir="${RUNNER_TEMP}/vale"
          archive="${vale_dir}/vale.tar.gz"
          mkdir -p "${vale_dir}"
          curl -fsSL -o "${archive}" \
            "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          echo "${VALE_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" -C "${vale_dir}" vale
          echo "${vale_dir}" >> "${GITHUB_PATH}"

      - name: Validate Makefile
        run: mbake validate Makefile

      - name: Install code
        run: make build

      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.1 fixed the wrapping
        # and Setext rewrites the estate relies on.
        uses: >-
          leynos/shared-actions/.github/actions/install-mdtablefix@a5765019912a8ab6882b12db049c7cde635f3a85
        with:
          version: '0.6.1'

      - name: Check formatting
        run: make check-fmt

      - name: Run ruff
        run: make lint

      - name: Run typechecker
        run: make typecheck

      - name: Run tests
        run: make test

      # Pull requests measure coverage and ratchet it without talking to
      # CodeScene. Coverage.xml is published to CodeScene from main by
      # coverage-main.yml alone; `make test-workflow-contracts` holds that
      # shape, and the generator selection here must match the publisher's.
      - name: Measure coverage
        if: github.event_name == 'pull_request'
        # Pin one interpreter in both lanes: generate-coverage builds its own
        # venv with a bare `uv venv`, which takes whatever uv finds first.
        env:
          UV_PYTHON: '3.13'
        uses: leynos/shared-actions/.github/actions/generate-coverage@5a99aed78ce68dcebd3052b75c31e6f173162b1e
        with:
          python-source: ./valedate
          output-path: coverage.xml
          format: cobertura
          artefact-name-suffix: valedate
          with-ratchet: 'true'
          publish-artefact: 'false'

      - name: Check the CV-005 contracts
        run: make test-workflow-contracts
